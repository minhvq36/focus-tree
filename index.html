<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Focus Tree Stopwatch</title>
    <style>
        :root{
            --bg: #f7fbf8;
            --accent: #2e7d32;
            --muted: #6b6b6b;
            --card: #ffffff;
            --primary: #2563eb;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #f1f8f3 0%, #ffffff 100%);
            font-family: Inter, Arial, sans-serif;
            color: var(--muted);
            overflow: hidden;
        }

        .app-container{
            width: 100%;
            height: 100%;
            background: var(--card);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        header.app-topbar{
            height: 56px;
            display:flex;
            align-items:center;
            padding: 0 20px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), rgba(250,250,250,0.8));
            border-bottom: 1px solid #e6e6e6;
            flex-shrink: 0;
        }

        .topbar-float{
            position:fixed;
            top:0;left:0;right:0;
            height:36px;
            display:flex;
            justify-content:flex-end;
            align-items:center;
            gap:6px;
            padding:0 10px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
            transform: translateY(-120%);
            transition: transform 200ms ease;
            z-index:1000;
            border-bottom: 1px solid #f0f0f0;
        }

        .topbar-float.show{ transform: translateY(0); }

        .topbar-float button{
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s ease;
            color: #9ca3af;
        }

        .topbar-float button:hover {
            background: rgba(107, 114, 128, 0.08);
            color: #6b7280;
        }

        .topbar-float button.close{
            background: transparent;
            color: #9ca3af;
            border: none;
            font-size: 16px;
        }

        .topbar-float button.close:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .topbar-float button.min{
            background: transparent;
            color: #9ca3af;
            border: none;
        }

        .topbar-float button.min:hover {
            background: rgba(107, 114, 128, 0.08);
            color: #6b7280;
        }

        .content{
            padding: 32px;
            flex: 1;
            overflow-y: auto;
        }

        .content h1 {
            text-align: center;
            margin: 0 0 16px 0;
        }

        .tree{ 
            font-size: 48px; 
            margin: 12px 0;
            text-align: center;
        }

        .timer-container{
            width: 220px;
            height: 220px;
            margin: 20px auto;
            position: relative;
        }

        #time-display{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: var(--accent);
            font-weight: 700;
        }

        .controls{
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .controls button{
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            min-width: 100px;
        }

        .controls button:hover{
            background: #1b5e20;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .controls button:active{
            transform: translateY(0);
            background: #155a2d;
        }

        .note-container{
            max-width: 600px;
            margin: 20px auto 0;
        }

        .note-container textarea{
            width: 100%;
            min-height: 100px;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e6e6e6;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: all 0.2s ease;
        }

        .note-container textarea:focus{
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .note-container button{
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            margin-top: 12px;
            transition: all 0.2s ease;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .note-container button:hover{
            background: #1b5e20;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .note-container button:active{
            transform: translateY(0);
            background: #155a2d;
        }

        .tab{
            display: flex;
            width: 100%;
            background: transparent;
            border-bottom: 1px solid #e6e6e6;
            padding: 0 20px;
            gap: 0;
            flex-shrink: 0;
        }

        .tab button{
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            position: relative;
        }

        .tab button:hover{
            color: var(--accent);
        }

        .tab button.active{
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tabcontent{
            flex: 1;
            overflow: auto;
            display: none;
        }

        .tabcontent[style*="display: block"]{
            display: block;
        }

        .productivity-frame{
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Progress circle SVG styling */
        #progress-circle {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        #progress {
            transition: stroke-dashoffset 0.3s ease;
            stroke-linecap: round;
        }
    </style>
    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>
</head>
<body>
    <div class="topbar-float" id="topbar">
        <button class="min" id="btn-min">_</button>
        <button class="close" id="btn-close">×</button>
    </div>

    <div class="app-container">
        <header class="app-topbar">
            <div style="flex:1"><strong style="color:var(--primary)">Focus Tree</strong></div>
            <div style="opacity:0.8">Stopwatch • Auto Notes • Productivity</div>
        </header>

        <div class="tab">
            <button class="tablinks active" onclick="openTab(event, 'Stopwatch')">Stopwatch & Auto Notes</button>
            <button class="tablinks" onclick="openTab(event, 'Productivity')">Productivity Inside</button>
        </div>

        <section id="Stopwatch" class="tabcontent" style="display:block;">
            <div class="content">
                <h1>Grow Your Focus Tree! 🌱</h1>
                <div class="timer-container">
                    <svg id="progress-circle" viewBox="0 0 220 220">
                        <circle cx="110" cy="110" r="100" fill="none" stroke="#e6f4ea" stroke-width="12"/>
                        <circle cx="110" cy="110" r="100" fill="none" stroke="var(--accent)" stroke-width="12"
                                stroke-dasharray="628.32" stroke-dashoffset="628.32" id="progress"/>
                    </svg>
                    <div id="time-display">00:00</div>
                </div>
                <div class="tree">🌱</div>
                <div class="controls">
                    <button onclick="startTimer()">Start</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="resetTimer()">Reset</button>
                </div>

                <div class="note-container">
                    <textarea id="note-input" placeholder=""></textarea><br>
                    <div style="text-align:right;margin-top:8px"><button onclick="submitNote()">Submit</button></div>
                </div>
            </div>
        </section>

        <section id="Productivity" class="tabcontent" style="display:none;">
            <iframe class="productivity-frame" src="http://localhost:8501"></iframe>
        </section>
    </div>

    <script>
        const fs = require('fs');
        const path = require('path');
        const { ipcRenderer } = require('electron');

        let startTime = null;
        let elapsedTime = 0;
        let timerId = null;
        const treeStages = ['🌱', '🌿', '🌳', '🌲'];
        let currentStage = 0;

        const timeDisplay = document.getElementById('time-display');
        const treeEl = document.querySelector('.tree');
        const progressEl = document.getElementById('progress');
        const noteInput = document.getElementById('note-input');

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const seconds = (totalSeconds % 60).toString().padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function updateTimer() {
            const now = Date.now();
            const currentElapsed = now - startTime + elapsedTime;
            timeDisplay.textContent = formatTime(currentElapsed);

            if (currentElapsed >= 2 * 60 * 60 * 1000) {
                updateTree(3);
            } else if (currentElapsed >= 50 * 60 * 1000) {
                updateTree(2);
            } else if (currentElapsed >= 25 * 60 * 1000) {
                updateTree(1);
            }

            const maxProgressTime = 2 * 60 * 60 * 1000;
            const progress = Math.min(currentElapsed / maxProgressTime, 1);
            progressEl.style.strokeDashoffset = 565.48 * (1 - progress);
        }

        function updateTree(stage) {
            if (stage !== currentStage) {
                currentStage = stage;
                treeEl.textContent = treeStages[currentStage];
                alert('🌳 Cây đã tiến hóa!');
            }
        }

        function startTimer() {
            if (!timerId) {
                startTime = Date.now();
                timerId = setInterval(updateTimer, 1000);
            }
        }

        function pauseTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                elapsedTime += Date.now() - startTime;
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            startTime = null;
            elapsedTime = 0;
            currentStage = 0;
            timeDisplay.textContent = '00:00';
            treeEl.textContent = treeStages[0];
            progressEl.style.strokeDashoffset = 628.32;
        }

        function submitNote() {
            const note = noteInput.value.trim();
            if (!note) {
                alert('Vui lòng nhập ghi chú trước khi lưu.');
                return;
            }

            const timestamp = new Date().toLocaleString('vi-VN');
            const line = `[${timestamp}] ${note}\n`;
            const filePath = path.join(__dirname, 'AUTONOTES.txt');

            try {
                fs.appendFileSync(filePath, line, 'utf8');
                noteInput.value = '';
            } catch (err) {
                alert('❌ Lỗi khi ghi file: ' + err.message);
            }
        }

        // Topbar behavior
        const topbar = document.getElementById('topbar');
        document.addEventListener('mousemove', (e) => {
            if (e.clientY < 50) topbar.classList.add('show'); else topbar.classList.remove('show');
        });

        document.getElementById('btn-min').addEventListener('click', () => ipcRenderer.send('app-minimize'));
        document.getElementById('btn-close').addEventListener('click', () => ipcRenderer.send('app-close'));

        timeDisplay.textContent = '00:00';

        // Open the default tab (already set to Stopwatch by default)
        // Utility to switch active classes
        function setActiveTabButtons(name) {
            const btns = document.getElementsByClassName('tablinks');
            for (let b of btns) {
                b.classList.remove('active');
                if (b.textContent.includes(name)) b.classList.add('active');
            }
        }

        // Override openTab to also set active style
        const oldOpen = openTab;
        openTab = function(evt, tabName) {
            oldOpen(evt, tabName);
            setActiveTabButtons(tabName === 'Stopwatch' ? 'Stopwatch' : 'Productivity');
        }

        document.getElementsByClassName("tablinks")[0].click();
    </script>
</body>
</html>
